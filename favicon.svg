<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#grad)"/>
  <!-- Container/Box symbol representing DevOps -->
  <rect x="25" y="30" width="50" height="40" rx="4" fill="white" opacity="0.95"/>
  <rect x="30" y="35" width="40" height="30" rx="2" fill="#2563eb" opacity="0.8"/>
  <!-- Stacked layers representing infrastructure -->
  <rect x="35" y="40" width="30" height="5" rx="1" fill="white"/>
  <rect x="35" y="48" width="30" height="5" rx="1" fill="white"/>
  <rect x="35" y="56" width="30" height="5" rx="1" fill="white"/>
